name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      # Runtime dependencies shipped to users must have no known advisories.
      - name: Audit production dependencies
        run: npm audit --omit=dev

      # Dev tooling (nodemon/chokidar braces, istanbul sprintf-js) has advisories
      # without a non-breaking upstream fix; block only on critical findings.
      - name: Audit development dependencies
        run: npm audit --audit-level=critical
